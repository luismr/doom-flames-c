name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Matches tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for changelog

    - name: Get version from tag
      id: get_version
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        VERSION=${TAG_NAME#v}
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Tag: $TAG_NAME, Version: $VERSION"

    - name: Get commit message for release notes
      id: get_commit_message
      run: |
        # Get the commit message of the tag
        COMMIT_MESSAGE=$(git tag -l --format='%(contents)' ${{ steps.get_version.outputs.tag_name }})
        if [ -z "$COMMIT_MESSAGE" ]; then
          # If no tag message, use the commit message
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
        fi
        
        # Create release notes
        cat > release_notes.md << EOF
        ## DOOM Fire Effect v${{ steps.get_version.outputs.version }}
        
        $COMMIT_MESSAGE
        
        ### 🔥 Fire Intensity Modes
        - **Mode 0**: Red/Orange flames (default)
        - **Mode 1**: Classic DOOM yellow/white flames  
        - **Mode 2**: Hot white flames
        
        ### 📦 Downloads
        Choose the appropriate build for your platform:
        - **Linux**: \`doomfire-linux-v${{ steps.get_version.outputs.version }}.tar.gz\`
        - **macOS**: \`doomfire-macos-v${{ steps.get_version.outputs.version }}.tar.gz\`
        - **Windows**: \`doomfire-windows-v${{ steps.get_version.outputs.version }}.zip\`
        
        ### 🚀 Quick Start
        \`\`\`bash
        # Extract and run
        ./doomfire --intensity 0 --optimized
        \`\`\`
        
        ### 🎮 New in this Release
        $COMMIT_MESSAGE
        EOF
        
        echo "Release notes created"

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.tag_name }}
        release_name: DOOM Fire Effect ${{ steps.get_version.outputs.tag_name }}
        body_path: release_notes.md
        draft: false
        prerelease: false

  build-and-upload:
    name: Build and Upload Release Assets
    needs: create-release
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            cc: gcc
            make: make
            binary: doomfire
            archive_cmd: tar -czf
            archive_ext: tar.gz
          - os: macos-latest
            platform: macos
            cc: clang
            make: make
            binary: doomfire
            archive_cmd: tar -czf
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows
            cc: gcc
            make: mingw32-make
            binary: doomfire.exe
            archive_cmd: 7z a
            archive_ext: zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup build environment (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make

    - name: Setup build environment (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Xcode Command Line Tools should be pre-installed
        which clang || xcode-select --install

    - name: Setup build environment (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          make

    - name: Build release (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        echo "Building release for ${{ matrix.platform }}"
        make clean
        make CC=${{ matrix.cc }} CFLAGS="-std=c99 -O3 -DNDEBUG -DVERSION=\"${{ needs.create-release.outputs.version }}\""
        
        # Verify build
        ls -la build/
        ./build/${{ matrix.binary }} --help

    - name: Build release (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        echo "Building release for Windows"
        make clean
        make CFLAGS="-std=c99 -O3 -DNDEBUG -DVERSION=\"${{ needs.create-release.outputs.version }}\""
        
        # Verify build
        ls -la build/
        ./build/${{ matrix.binary }} --help

    - name: Prepare release package (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        # Create release directory
        RELEASE_DIR="doomfire-${{ matrix.platform }}-v${{ needs.create-release.outputs.version }}"
        mkdir -p "$RELEASE_DIR"
        
        # Copy files
        cp build/${{ matrix.binary }} "$RELEASE_DIR/"
        cp README.md "$RELEASE_DIR/"
        cp LICENSE* "$RELEASE_DIR/" 2>/dev/null || true
        
        # Create archive
        ${{ matrix.archive_cmd }} "$RELEASE_DIR.${{ matrix.archive_ext }}" "$RELEASE_DIR"
        
        echo "RELEASE_FILE=$RELEASE_DIR.${{ matrix.archive_ext }}" >> $GITHUB_ENV
        echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

    - name: Prepare release package (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        # Create release directory
        RELEASE_DIR="doomfire-${{ matrix.platform }}-v${{ needs.create-release.outputs.version }}"
        mkdir -p "$RELEASE_DIR"
        
        # Copy files
        cp build/${{ matrix.binary }} "$RELEASE_DIR/"
        cp README.md "$RELEASE_DIR/"
        cp LICENSE* "$RELEASE_DIR/" 2>/dev/null || true
        
        # Create archive (using PowerShell for zip)
        powershell "Compress-Archive -Path '$RELEASE_DIR' -DestinationPath '$RELEASE_DIR.zip'"
        
        echo "RELEASE_FILE=$RELEASE_DIR.zip" >> $GITHUB_ENV
        echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ${{ env.RELEASE_FILE }}
        asset_name: doomfire-${{ matrix.platform }}-v${{ needs.create-release.outputs.version }}.${{ matrix.archive_ext }}
        asset_content_type: application/octet-stream

    - name: Upload build artifacts for verification
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.platform }}-v${{ needs.create-release.outputs.version }}
        path: ${{ env.RELEASE_FILE }}
        retention-days: 90

  verify-release:
    name: Verify Release
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    
    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@v4

    - name: Verify all platform builds
      run: |
        echo "Verifying release artifacts for v${{ needs.create-release.outputs.version }}"
        
        # List all downloaded artifacts
        find . -name "*.tar.gz" -o -name "*.zip" | sort
        
        # Verify each platform
        if [ -f "release-linux-v${{ needs.create-release.outputs.version }}/doomfire-linux-v${{ needs.create-release.outputs.version }}.tar.gz" ]; then
          echo "✅ Linux release package found"
        else
          echo "❌ Linux release package missing"
          exit 1
        fi
        
        if [ -f "release-macos-v${{ needs.create-release.outputs.version }}/doomfire-macos-v${{ needs.create-release.outputs.version }}.tar.gz" ]; then
          echo "✅ macOS release package found"
        else
          echo "❌ macOS release package missing"
          exit 1
        fi
        
        if [ -f "release-windows-v${{ needs.create-release.outputs.version }}/doomfire-windows-v${{ needs.create-release.outputs.version }}.zip" ]; then
          echo "✅ Windows release package found"
        else
          echo "❌ Windows release package missing"
          exit 1
        fi
        
        echo "🎉 All release packages verified successfully!"

    - name: Post-release notification
      run: |
        echo "🔥 DOOM Fire Effect v${{ needs.create-release.outputs.version }} released successfully!"
        echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.tag_name }}"