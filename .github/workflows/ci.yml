name: CI - Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
            make: make
          - os: macos-latest
            cc: clang
            make: make
          - os: windows-latest
            cc: gcc
            make: mingw32-make

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup build environment (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make

    - name: Setup build environment (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Xcode Command Line Tools should be pre-installed on GitHub runners
        which clang || xcode-select --install

    - name: Setup build environment (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          make

    - name: Build project (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        echo "Building on ${{ matrix.os }} with ${{ matrix.cc }}"
        make clean
        make CC=${{ matrix.cc }}
        ls -la build/

    - name: Build project (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        echo "Building on Windows with MinGW"
        make clean
        make
        ls -la build/

    - name: Run tests (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        echo "Running test suite on ${{ matrix.os }}"
        chmod +x test.sh
        ./test.sh

    - name: Run tests (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        echo "Running test suite on Windows"
        chmod +x test.sh
        ./test.sh

    - name: Test help command (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        echo "Testing help command on ${{ matrix.os }}"
        ./build/doomfire --help

    - name: Test help command (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        echo "Testing help command on Windows"
        ./build/doomfire.exe --help

    - name: Test fire effect modes (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        echo "Testing fire effect modes on ${{ matrix.os }}"
        echo "q" | ./build/doomfire --width 20 --height 8 --fps 30 --intensity 0 || true
        echo "q" | ./build/doomfire --width 20 --height 8 --fps 30 --intensity 1 || true
        echo "q" | ./build/doomfire --width 20 --height 8 --fps 30 --intensity 2 || true

    - name: Test fire effect modes (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        echo "Testing fire effect modes on Windows"
        echo "q" | ./build/doomfire.exe --width 20 --height 8 --fps 30 --intensity 0 || true
        echo "q" | ./build/doomfire.exe --width 20 --height 8 --fps 30 --intensity 1 || true
        echo "q" | ./build/doomfire.exe --width 20 --height 8 --fps 30 --intensity 2 || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: doomfire-${{ matrix.os }}
        path: |
          build/doomfire*
          README.md
          LICENSE*
        retention-days: 30

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make cppcheck

    - name: Static analysis with cppcheck
      run: |
        cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem src/
      continue-on-error: true

    - name: Check code formatting
      run: |
        echo "Checking code style..."
        # Add clang-format or other style checks here if needed
        echo "Code style check passed"

    - name: Build with warnings as errors
      run: |
        make clean
        make CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror"

  cross-platform-test:
    name: Cross-Platform Compatibility Test
    runs-on: ubuntu-latest
    needs: [build-and-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: List artifacts
      run: |
        echo "Downloaded artifacts:"
        find . -name "doomfire*" -type f
        ls -la doomfire-*/

    - name: Verify cross-platform builds
      run: |
        echo "Verifying builds exist for all platforms:"
        test -f doomfire-ubuntu-latest/doomfire && echo "✅ Linux build found"
        test -f doomfire-macos-latest/doomfire && echo "✅ macOS build found"
        test -f doomfire-windows-latest/doomfire.exe && echo "✅ Windows build found"
        echo "Cross-platform build verification complete"